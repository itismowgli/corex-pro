<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreX Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-SKnHeRIKhoCJXdg1ZtHNFkpUxNyTqVzE4RM6k3kh7c8oq7ZmT5hJGHrDnH5LHLT" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/tailwind.min.css">
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold tracking-tight">
        <span class="text-blue-400">CoreX</span>
        <span class="text-gray-300">Pro</span>
      </span>
      {{if .State.Domain}}
      <span class="text-gray-500 text-sm">{{.State.Domain}}</span>
      {{end}}
    </div>
    <span class="text-gray-500 text-xs tabular-nums">
      {{if .State.Version}}v{{.State.Version}} · {{end}}{{.State.ServerIP}}
    </span>
  </header>

  <!-- Tab navigation (hx-boost replaces <body> so nav re-renders with correct active state) -->
  <nav class="bg-gray-900 border-b border-gray-800 px-4" hx-boost="true">
    <div class="flex gap-0">
      {{$tab := .Tab}}
      <a href="/"
         class="px-5 py-3 text-sm font-medium border-b-2 transition-colors
                {{if eq $tab "services"}}border-blue-500 text-blue-400{{else}}border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-600{{end}}">
        Services
      </a>
      <a href="/tab/storage"
         class="px-5 py-3 text-sm font-medium border-b-2 transition-colors
                {{if eq $tab "storage"}}border-blue-500 text-blue-400{{else}}border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-600{{end}}">
        Storage
      </a>
      <a href="/tab/network"
         class="px-5 py-3 text-sm font-medium border-b-2 transition-colors
                {{if eq $tab "network"}}border-blue-500 text-blue-400{{else}}border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-600{{end}}">
        Network
      </a>
      <a href="/tab/system"
         class="px-5 py-3 text-sm font-medium border-b-2 transition-colors
                {{if eq $tab "system"}}border-blue-500 text-blue-400{{else}}border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-600{{end}}">
        System
      </a>
    </div>
  </nav>

  <!-- Tab content (HTMX swaps this for tab-only partial requests) -->
  <main id="content" class="p-6 max-w-7xl mx-auto">
    {{.Content}}
  </main>

  <!-- Log viewer modal (opened by JS, closed by button) -->
  <div id="log-modal" class="hidden fixed inset-0 bg-black/75 z-50 flex flex-col justify-end">
    <div class="bg-gray-900 border-t border-gray-700 flex flex-col" style="height:50vh">
      <div class="flex items-center justify-between px-4 py-2 border-b border-gray-700 shrink-0">
        <span class="text-sm font-mono text-gray-300">
          Logs: <span id="log-modal-title" class="text-blue-400"></span>
        </span>
        <button onclick="closeLogs()" class="text-gray-400 hover:text-white text-lg leading-none px-2">✕</button>
      </div>
      <pre id="log-output"
           class="flex-1 overflow-auto p-4 text-xs font-mono text-green-400 bg-gray-950 leading-relaxed"></pre>
    </div>
  </div>

  <script>
    var _logSource = null;

    function openLogs(container, label) {
      var modal = document.getElementById('log-modal');
      var title = document.getElementById('log-modal-title');
      var output = document.getElementById('log-output');

      title.textContent = label || container;
      output.textContent = '';
      modal.classList.remove('hidden');

      if (_logSource) { _logSource.close(); }

      _logSource = new EventSource('/api/logs/' + encodeURIComponent(container));
      _logSource.onmessage = function(e) {
        output.textContent += e.data + '\n';
        output.scrollTop = output.scrollHeight;
      };
      _logSource.onerror = function() {
        output.textContent += '\n[stream ended]\n';
        _logSource.close();
        _logSource = null;
      };
    }

    function closeLogs() {
      if (_logSource) { _logSource.close(); _logSource = null; }
      document.getElementById('log-modal').classList.add('hidden');
    }

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLogs();
    });
  </script>
</body>
</html>
